name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[ui,dev]'
      - run: ruff check .
      - run: pytest -q
      - run: ndt demo-data --count 12 --output data/ci
      - run: ndt check-data --data data/ci/dataset.yaml
      - run: ndt predict --demo --source data/ci/images/train/synthetic_00007.png --output outputs/ci
